{% extends "base.html" %}
{% block content %}
    <div class='mx-auto w-80 my-9'>
        {% if messages %}
            {% for message in messages %}
                <div class="px-2 py-1 {% if message.tags == 'success' %}bg-green-500{% endif %} ">{{message}}</div>
            {% endfor %}
        {% endif %}
        <form method='POST'>
            {% csrf_token %}
            {{ form }}
            <div class="flex justify-between">
                <button class='bg-blue-500 px-2 py-1 rounded text-white mt-3' type="submit">Sign In</button> 
                <p class="pt-2"><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
            </div>
            
        </form>
       
    </div>
{% endblock content %}
